# Base scenario for the conflict-resolution experiment (D-013 to D-015, D-017).
# One snapshot of four aircraft in one en-route sector. Numbers: see
# knowledge/models/experiment-scenario-numbers.md for the source and grade of each.
# Every item was confirmed by the owner on 2026-10-29 (D-037).
#
# Keys written in camelCase are attribute names of definitions in the SysML model
# (cameo_models/), mirrored in nas_types.py and checked by test_model_conformance.py
# (D-025): `type` is NasAnalysis::PerformanceModel, each entry of `flights` is a
# NasAnalysis::ScenarioFlight (its `flight` a FlightOperations::Flight, its `cruise` a
# NasAnalysis::CruiseCondition), each entry of `options` a NasAnalysis::ResolutionOption.
# Keys in snake_case (geometry, costs, role, heading_deg) are the experiment's own
# settings and have no definition in the model.

name: base
sector: "Fort Worth Center (ZFW) high-altitude airspace, crossing about 42 NM southwest of DFW"

type:
  aircraftType: B39M         # ICAO code, 737 MAX 9 (D-015); OpenAP borrows the MAX 8 drag polar
  nominalMassKg: 67000       # the one weight per type that the nominal model (case B) uses
  mass_spread_fraction: 0.06 # heavy/light = nominal x (1 +/- 0.06); coppenbarger1999climbPrediction Table 3
  mmo: 0.82

geometry:
  crossing_level_ft: 38000          # FL380, westbound even level (D-014 item 3)
  blocked_levels_ft: [36000]        # AC3 and AC4 under the crossing point at FL360
  time_to_crossing_min: 12          # decision made this far ahead of the crossing
  maneuver_hold_min: 15             # an altitude or vector change is held this long before the conflict has cleared
  reclimb_available: true           # a descended aircraft is cleared back up afterwards (second instruction)
  vector_extra_nm: 6.0              # extra track miles for a "pass behind" path stretch: delays the aircraft ~5.4 NM (5 NM / cos 21.5 deg at the 43 deg crossing) plus margin, flown over the ~90 NM to the crossing (owner 2026-10-29)
  speed_change_mach: 0.04           # lever built to fail (D-014 item 2): cannot separate the pair
  speed_lever_separates: false
  climb_rule_ft: 35000              # climbs offered only at or below FL350 when weight is unknown (engility2014tasarAlaska p. 8)
  altitude_steps_ft: [2000, -2000, -4000]
  min_climb_rate_ft_min: 150        # a level is flown only with this much climb left there [SME]; the service-ceiling definition is 100 (faa2015ac61107b para. 1-4r)
  slow_mach: 0.04                   # option O9: AC3 and AC4 slow from Mach 0.80 to 0.76 (about 440 KTAS) for slow_min minutes, opening 3+ NM ahead of AC3 (owner 2026-10-29)
  slow_min: 12
  case_a_moves_first: AC2           # case A tie-breaker: the crossing aircraft with no in-trail traffic on its track (owner 2026-10-29)

costs:
  fuel_price_usd_per_kg: 2.50       # owner 2026-10-29: Jet-A with airport markups, $4.80 to $8.47/gal seen; $2.50/kg is about $7.60/gal
  co2_per_kg_fuel: 3.16             # icao2024icecMethodology p. 6 (D-015)
  connection_threshold_min: 12      # arrival slot spacing 10 to 15 min [SME]
  missed_connection_cost_usd: null  # K, unsourced; the table reports yes/no until a value is held
  carbon_price_usd_per_t: 15.0      # CORSIA-style credit, confirmed by the owner 2026-10-29; trade-press range 10 to 22 USD/t, unsourced
  nominal_cost_index: 22.68         # kg/min (Boeing CI 30): the cost index case B and the similar-weights variation assume; middle of the scenario's range, owner confirmed 2026-10-29 (D-037)

# The airline's facts about each flight. What the airline would share with the deciding
# party (FlightOperations::AirlinePerformanceShare: grossWeightKg, costIndex,
# delayMarginMin) is not written here; experiment_scoring.airline_share derives it:
# delayMarginMin = costs.connection_threshold_min - scheduleDeltaMin when hasConnections.
flights:
  - flight: {flightNumber: AC1, airline: X, departureAirport: KMCO, arrivalAirport: KLAX}
    role: "crossing pair, heavy, late with connections"
    cruise: {massKg: 71020, machNumber: 0.80, altitudeFt: 38000}   # nominal x 1.06; holds FL380 with the climb margin, cannot hold FL400
    heading_deg: 281
    distanceToGoNm: 1069
    costIndex: 45.36                # Boeing CI 60 (high); 1 CI = 100 lb/hr = 0.756 kg/min (owner 2026-10-29)
    scheduleDeltaMin: 8             # positive = late on entry
    hasConnections: true
  - flight: {flightNumber: AC2, airline: Y, departureAirport: KIAH, arrivalAirport: KDEN}
    role: "crossing pair, light, on time"
    cruise: {massKg: 62980, machNumber: 0.80, altitudeFt: 38000}   # nominal x 0.94; holds FL400 with the climb margin
    heading_deg: 324
    distanceToGoNm: 584
    costIndex: 7.56                 # CI 10 (low)
    scheduleDeltaMin: 0
    hasConnections: false
  - flight: {flightNumber: AC3, airline: X, departureAirport: KTPA, arrivalAirport: KLAX}
    role: "in trail under the crossing, early"
    cruise: {massKg: 67000, machNumber: 0.80, altitudeFt: 36000}
    heading_deg: 281
    distanceToGoNm: 1000
    costIndex: 7.56                 # CI 10 (low)
    scheduleDeltaMin: -6
    hasConnections: false
  - flight: {flightNumber: AC4, airline: Z, departureAirport: KTPA, arrivalAirport: KLAX}
    role: "in trail behind AC3; context"
    cruise: {massKg: 67000, machNumber: 0.80, altitudeFt: 36000}
    heading_deg: 281
    distanceToGoNm: 1030
    costIndex: 22.68                # CI 30 (medium)
    scheduleDeltaMin: 0
    hasConnections: false

# Resolution options (experiment-options-and-scoring.md section 2). Each maneuver is one
# instruction to one flight; instructions/follow-ups per fothergill2013resolutionHeuristics.
options:
  - optionId: O1
    instructionsNow: 1
    maneuvers: [{flightNumber: AC1, kind: altitude, deltaFt: -2000}]
  - optionId: O2
    instructionsNow: 1
    maneuvers: [{flightNumber: AC2, kind: altitude, deltaFt: -2000}]
  - optionId: O3
    instructionsNow: 1
    maneuvers: [{flightNumber: AC1, kind: altitude, deltaFt: 2000}]
  - optionId: O4
    instructionsNow: 1
    maneuvers: [{flightNumber: AC2, kind: altitude, deltaFt: 2000}]
  - optionId: O5
    instructionsNow: 1
    maneuvers: [{flightNumber: AC1, kind: vector}]
  - optionId: O6
    instructionsNow: 1
    maneuvers: [{flightNumber: AC2, kind: vector}]
  - optionId: O7
    instructionsNow: 1
    maneuvers: [{flightNumber: AC1, kind: speed}]
  - optionId: O8
    instructionsNow: 1
    maneuvers: [{flightNumber: AC1, kind: altitude, deltaFt: -4000}]
  - optionId: O9
    instructionsNow: 3
    maneuvers: [{flightNumber: AC1, kind: altitude, deltaFt: -2000}, {flightNumber: AC3, kind: slow}, {flightNumber: AC4, kind: slow}]
  - optionId: O10
    instructionsNow: 1
    maneuvers: [{flightNumber: AC2, kind: altitude, deltaFt: -4000}]   # mirror of O8; added 2026-10-29 with the case A tie-breaker
